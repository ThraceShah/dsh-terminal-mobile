# dsh-terminal-mobile bundle layer.
#
# One row: the plugin's host half is an empty `apply()` that exists only so the
# Loader has something to mount; the browser half ships through
# exports["./client"] and is discovered from the package.json dsh.client
# declaration. The row must load after the official sidebar terminal row only
# for readability — the shadowing decision is the slot priority, not row order.
- insert:
    - id: terminal-mobile
      name: 'dsh-terminal-mobile'
